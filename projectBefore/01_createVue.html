<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建一个Vue实例</title>
</head>
<body>
    <div id="box">
        {{message}}
    </div>
    <div id="box2">
        {{title}}
    </div>
    <div id="app">
        <h1>{{title}}</h1>
        <p>{{message}}</p>
    </div>
</body>
<!-- 引入开发版本包 （包含完整注释和警告） 官网v2.cn.vuejs.org -->
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
<script>
    const app = new Vue({
        // 指定挂载点
        el: '#app',
        // 定义数据
        data: {
            message: 'Hello Vue!',
            title:"Vue Study"
        }
    })
</script>
</html>
