<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v-bind</title>
</head>
<body>
    <!-- v-bind 动态设置html标签的属性 src,title-->
   
     <div id="app">
        <!-- 动态绑定 -->
        <img v-bind:src="imgUrl">
        <!-- 简写为：src -->
        <img :src="imgUrl">
     </div>
     

</body>
<!-- 引入开发版本包 （包含完整注释和警告） 官网v2.cn.vuejs.org -->
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
<script>
    const app = new Vue({
        el: '#app',
        data: {
            imgUrl:'../../640.jpg'
        },
        methods:{
            
        }
    })
</script>
</html>
