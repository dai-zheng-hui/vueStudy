<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>响应式特性</title>
    </head>
    <body>
        <div id="app">
            {{message}}
            <h1>{{title}}</h1>
            <h2>{{count}}</h2>
        </div>
        
    </body>
    <!-- 引入开发版本包 （包含完整注释和警告） 官网v2.cn.vuejs.org -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script>
        const app = new Vue({
            el: '#app',
            data: {
                message: 'hello world',
                title: '响应式特性',
                count: 0
            }
        })
    </script>
</html>
