<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v-for</title>
</head>
<body>
    <!-- v-for 基于数据循环，多次渲染整个元素，数组、对象、数字 -->
    <div id="app">
        <ul>
            <li v-for="item in items">{{item}}</li>
        </ul>
    </div>
</body>
<!-- 引入开发版本包 （包含完整注释和警告） 官网v2.cn.vuejs.org -->
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
<script>
    const app = new Vue({
        el: '#app',
        data: {
            items: ['a', 'b', 'c', 'd', 'e']
        },
        methods:{
            
        }
    })
</script>
</html>
