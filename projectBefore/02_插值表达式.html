<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>插值表达式</title>
    </head>
    <!-- 引入开发版本包 （包含完整注释和警告） 官网v2.cn.vuejs.org -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <body>
        <div id="app">
            <p>{{nickName}}</p>
            <p>{{age}}</p>
            <p>{{nickName + '今年' + age + '岁'}}</p>
            <p>{{age > 18 ? '成年' : '未成年'}}</p>
            <p> {{nickName.toUpperCase()}}</p>
        </div>
    </body>
    <script>
const vue = new Vue({
    el: '#app',
    data: {
        nickName:'John',
        age: 28
    }
})
</script>
</html>
