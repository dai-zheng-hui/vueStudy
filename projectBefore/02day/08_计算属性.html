<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算属性</title>
</head>
<style>
    td {
        width: 100px;
        height: 40px;
        text-align: center;
        line-height: 40px;
    }
    .font {
        font-weight: bold;
    }
</style>
<body>
    <div id="app">
        <table border="1px">
            <tr>
                <td class="font">名字</td>
                <td class="font">数量 <span>{{totalCountFn()}}</span></td>
            </tr>
            <tr v-for="(item,index) in list">
                <td>{{item.name}}</td>
                <td>{{item.num}}</td>
            </tr>
        </table>
        <p>总数{{totalCountFn()}}个</p>
    </div>
</body>
<!-- 引入开发版本包 （包含完整注释和警告） 官网v2.cn.vuejs.org -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script>
        const app = new Vue({
            el:"#app",
            data:{
              list: [
                {id: 1,name: "篮球",num: 1},
                {id: 2,name: "羽毛球",num: 1},
                {id: 3,name: "足球",num: 1},
              ],
            },
            // 计算属性 一个计算属性对应一个函数，需要有返回结果
            // 本质还是一个属性，不能当作函数用
            // 基于现有数据，计算出一个新属性，依赖的数据变化，自动重新计算
            // 使用和基本属性一样 {{属性名}} this.属性名
            // 作用：封装了一段对数据的处理，求得一个结果
            // 缓存特性（提升性能）
            // 计算属性对计算出来的结果缓存，再次使用直接读取缓存，依赖项变化了，会自动重新计算，并且再次缓存




            // methods方法：
            // 给实例一个方法，调用以处理业务逻辑
            // 写在methods配置项中
            // 作为方法，需要调用， this.方法名() {{方法名}} @事件名="方法名"
             computed:{
                totalCount(){
                    console.log("计算属性执行了");
                    // 对列表的num进行求和
                    return this.list.filter(item => item.num != 0).reduce((sum,item) => sum + item.num,0)
                }
            },
            methods: {
                // 每一个调用都会触发
               totalCountFn(){
                    console.log("methods执行了");
                    // 对列表的num进行求和
                    return this.list.filter(item => item.num != 0).reduce((sum,item) => sum + item.num,0)
                }
            },
        })
</script>
</html>
