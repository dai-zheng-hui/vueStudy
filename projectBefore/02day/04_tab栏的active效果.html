<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>tab栏的active效果</title>
    </head>
    <style>
        /* :class="对象/数组" */
        .active {
           background-color: red;
           color: white;
           border-right: 1px solid black;
        }
        ul {
            width: 240px;
            height: 60px;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            border-bottom: 3px solid black;
            padding: 0;
            margin: 0;
        }
        li {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        a {
            height: 50px;
            width: 100%;
            line-height: 50px; /* 与 height 相同 */
            text-decoration: none; /* 去掉下划线 */
            color: inherit;        /* 继承父元素颜色，或直接写具体颜色 */
            align-items: center;
        }
       
        
    </style>
    <body>
        <div id="app">
            <ul>
                <li v-for="(item,index) in list" :key="item.id"  @click="activeIndex = index">
                    <a href="#" :class="{active:index === activeIndex}">{{item.name}}</a>
                </li>
            </ul>   
        </div>
    </body>
    <!-- 引入开发版本包 （包含完整注释和警告） 官网v2.cn.vuejs.org -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script>
        const app = new Vue({
            el:"#app",
            data:{
                list:[
                    {id:1,name:'京东秒杀'},
                    {id:2,name:'品牌特价'},
                    {id:3,name:'每日特惠'},
                ],
                activeIndex:0 //记录高亮
            },
            methods: {
                
            },
        })
</script>
</html>
