<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>v-bind对样式的控制03</title>
    </head>
    <style>
        /* :class="对象/数组" */
        .box {
            width: 400px;
            height: 400px;
            border: 3px solid black;
            font-size: 30px;
            margin-top: 20px;
        }
        .pink {
            background-color: pink;
        }
        .big {
            width: 300px;
            height: 300px;
        }
        
    </style>
    <body>
        <div id="app">
            <div class="box" :class="{pink:true,big:true}">
                小黑子学前端
            </div>
            <div class="box" :class="['pink','big']">
                小黑子学前端
            </div>
        </div>
    </body>
    <!-- 引入开发版本包 （包含完整注释和警告） 官网v2.cn.vuejs.org -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script>
        const app = new Vue({
            el:"#app",
            data:{
                
            },
            methods: {
                
            },
        })
</script>
</html>
