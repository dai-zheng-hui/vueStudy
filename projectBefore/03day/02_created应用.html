<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>created应用</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }
    ul {
        list-style: none;
    }
    li {
        display: float;
        margin: 20px 0;
        height: 200px;
    }
    li .left {
        float: left;
        height: 200px;
    }
    li .right {
        float: right;
        height: 200px;
    }
    li .right img {
        margin: 0px 20px;
        width: 294px;
        height: 195px;
    }
    li .left a {
        display: block;
        height: 30px;
        margin-left: 10px;
        font-size: 18px;
        color: #000;
        font-weight: bold;
        text-decoration: none;
    }
    .bottom {
        margin-top: 130px;
        height: 20px;
    }
    .bottom span {
        font-size: 14px;
        color: #ccc;
        margin:0 10px 0 10px;
    }
</style>
<body>
    <div id="app">
        <ul>
            <li v-for="item in list" :key="item.id">
                <div class="left">
                    <a :href="item.img" target="_blank">
                        {{ item.title }}
                    </a>
                    <div class="bottom">
                        <span>{{ item.source }}</span>
                        <span>{{ item.time }}</span>
                    </div>
                </div>
                <div class="right">
                    <img :src="item.img" alt="news`s image">
                </div>
            </li>
        </ul>
    </div>
</body>
<!-- 引入开发版本包 -->
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
 <!-- 引入axios包 -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    const app = new Vue({
        el: '#app',
        data: {
            list: [],
        },
        created() {
            this.initData();
        },
        methods: {
            async initData() {
                // 发送请求获取数据
                const res = await axios.get('https://hmajax.itheima.net/api/news');
                // console.log(res);
                // 将数据保存到list中
                this.list = res.data.data;
            }
        },
    })
</script>
</html>
